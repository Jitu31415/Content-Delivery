<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Course Viewer</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/static/youtube-theme.css">
</head>
<body>

    <div class="top-nav">
        <a href="/youtube" class="back-btn text-decoration-none">&larr; Back to Search</a>
    </div>

    <div class="container-fluid px-4 pb-4">
        <div class="row g-4">

            <div class="col-xl-8 col-lg-7 col-md-12">
                <div class="ratio ratio-16x9 shadow-lg">
                    <iframe id="ytplayer"
                            sandbox="allow-scripts allow-same-origin allow-presentation"
                            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
                            allowfullscreen
                            frameborder="0">
                    </iframe>
                </div>
                <h4 class="mt-4 current-title-heading" id="currentTitle">Loading...</h4>
            </div>

            <div class="col-xl-4 col-lg-5 col-md-12">
                <div class="playlist-header">
                    COURSE QUEUE
                </div>
                <div class="queue-container" id="playlistScrollBox">
                    {% for video in videos %}
                    <div class="queue-item" id="queue-item-{{ loop.index0 }}" data-index="{{ loop.index0 }}">
                        <img src="{{ video['Thumbnail'] }}" class="queue-img">
                        <div>
                            <div class="queue-title">{{ video['Title'] }}</div>
                            <div class="queue-channel">{{ video['Channel'] }}</div>
                        </div>
                    </div>
                    {% endfor %}
                </div>
            </div>

        </div>
    </div>

    <script>
        const playlistQueue = {{ videos | tojson }};
        const iframe = document.getElementById('ytplayer');

        window.addEventListener('DOMContentLoaded', () => {
            if (playlistQueue.length > 0) {
                loadVideoSource(0, false); // no forced autoplay on initial load
            }
            document.getElementById('playlistScrollBox').addEventListener('click', (e) => {
                const item = e.target.closest('.queue-item');
                if (item) {
                    playVideo(parseInt(item.dataset.index, 10));
                }
            });
        });

        function playVideo(index) {
            loadVideoSource(index, true); // forced autoplay on user click
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function loadVideoSource(index, forceAutoplay) {
            const video = playlistQueue[index];
            const videoId = video.Video_ID;
            let srcUrl = `https://www.youtube.com/embed/${videoId}?rel=0&modestbranding=1`;
            if (forceAutoplay) srcUrl += "&autoplay=1";
            iframe.src = srcUrl;
            updateUI(index);

            // Same history mechanism as the rest of the app — course-mode
            // plays land in "jump back in" the same as video-mode plays.
            fetch('/youtube/click', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ video_id: videoId, title: video.Title }),
            }).catch(() => {});
        }

        function updateUI(index) {
            document.getElementById('currentTitle').innerText = playlistQueue[index].Title;
            document.querySelectorAll('.queue-item').forEach(el => el.classList.remove('active-video'));
            const activeItem = document.getElementById('queue-item-' + index);
            if (activeItem) activeItem.classList.add('active-video');
        }
    </script>
</body>
</html>
